version: "3.8"

# CPU pinning (host has 10 vCPUs: 0-9). Cores 8 and 9 belong to the two graders,
# one each, so their timings don't depend on web/DB load; every other service
# uses *other_cores. Both sides are needed, or Docker would still schedule other
# containers on the graders' cores. Re-derive with `nproc` if the host changes.
# (`deploy.resources` is ignored outside Swarm, hence `cpuset`.)
x-other-cores: &other_cores "0-7"

# Shared by both graders. Each one gives safeexec its own range of user ids
# (SAFEEXEC_UIDS) so submissions from different graders never share a user id,
# and with it the per-user --nproc limit (see parse_uids in grader.py).
#
# Stopping a grader is graceful: on `docker stop` it finishes the submission in
# hand, takes no new ones, and exits (see StopRequest in grader.py). `exec`
# makes the grader the process that receives the stop signal instead of bash;
# `init` adds a tiny init that forwards it and reaps finished processes.
# stop_grace_period is how long Docker waits before killing it anyway, so keep
# it well above the slowest submission.
x-grader: &grader
  image: judge-grader
  command: bash -c "bash grader-firewall.sh && exec /opt/environ/bin/python3 manage.py grader"
  init: true
  stop_grace_period: 10m
  volumes:
    - problems:/problems
  cap_add:
    - NET_ADMIN
  ulimits:
    stack: -1

services:
  database:
    image: postgres:16
    cpuset: *other_cores
    environment:
      - POSTGRES_DB=judge
      - POSTGRES_USER=judge
      - POSTGRES_PASSWORD=uhdtas
    volumes:
      # PG 16 lives in a NEW volume so the old PG 11 data (`pgdb`) stays intact
      # for instant rollback. Roll back by reverting image->postgres:11.5 and
      # this mount->pgdb, then `up`. Delete `pgdb` only after PG 16 is confirmed good.
      - pgdb16:/var/lib/postgresql/data
  api:
    build:
      context: ../..
      dockerfile: docker/prod/dockerfile
    cpuset: *other_cores
    command: environ/bin/gunicorn --workers 4 --statsd-host=statsd_exporter:9125 --statsd-prefix=judge -b :8000 judge.wsgi:application
    volumes:
      - varwww:/var/www/judge
      - problems:/problems
    depends_on:
      - database
  nginx:
    image: nginx:stable-alpine
    cpuset: *other_cores
    volumes:
      # Read-only: static files come from collectstatic in the api container
      # and media files from uploads through the api.
      - varwww:/var/www/judge:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Cloudflare Origin CA certificate and key (origin.pem, origin.key)
      - /etc/matcomgrader/ssl:/etc/nginx/ssl:ro
    # The only published ports: everything else is reached through nginx.
    # Docker's published ports bypass ufw, so the other services must not
    # publish any.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped
  grader:
    <<: *grader
    # Builds the judge-grader image both graders run.
    build:
      context: ../..
      dockerfile: docker/common/dockerfile.grader
    cpuset: "8"
    environment:
      - SAFEEXEC_UIDS=10000-19999
  grader-2:
    <<: *grader
    pull_policy: never
    cpuset: "9"
    environment:
      - SAFEEXEC_UIDS=20000-29999
  ######################################################################
  # Monitoring
  ######################################################################
  prometheus:
    image: prom/prometheus:latest
    cpuset: *other_cores
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./web-config.yml:/etc/prometheus/web-config.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.config.file=/etc/prometheus/web-config.yml"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/prometheus/"
    extra_hosts:
      # We needed to connect to a `node_exporter` running
      # in host mode, so we also had to scrape an endpoint
      # expose at the host level.
      #
      # We still need to allow connections from Docker. If
      # we're using something like UFW, we need to gather the
      # Docker subnet info and enable it:
      # $ docker network inspect prod_default | jq .[0].IPAM.Config.[0].Subnet
      # $ sudo ufw allow from 172.18.0.0/16 to any port 9100 proto tcp
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    cpuset: *other_cores
    env_file:
      # docker/prod/grafana.env
      # -----------------------
      # GF_SECURITY_ADMIN_USER=XXX
      # GF_SECURITY_ADMIN_PASSWORD=XXX
      - ./grafana.env
    environment:
      - GF_SERVER_ROOT_URL=/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    cpuset: *other_cores
    environment:
      - DATA_SOURCE_NAME=postgresql://judge:uhdtas@database:5432/judge?sslmode=disable
    depends_on:
      - database
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    # host network/pid namespaces don't exempt it from the cgroup cpuset
    cpuset: *other_cores
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
  statsd_exporter:
    image: prom/statsd-exporter
    cpuset: *other_cores


volumes:
  grafana:
  pgdb:      # PG 11 data — kept for rollback; remove once PG 16 is confirmed good
  pgdb16:    # PG 16 data (restore target for the 11 -> 16 upgrade)
  problems:
  varwww:
