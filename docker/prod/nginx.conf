# nginx running in Docker (the `nginx` service in docker-compose.yml). It is the
# site's entry point: Cloudflare connects to it on port 443 (or 80), it serves
# /static/ and /media/ straight from the varwww volume, and it proxies the rest
# to the other containers.

server {
    listen 80;
    listen 443 ssl;

    # Cloudflare Origin CA certificate, from /etc/matcomgrader/ssl on the host.
    # Only Cloudflare trusts it, which is fine: with Cloudflare's SSL mode set to
    # "Full (strict)", nothing but Cloudflare should reach this server directly.
    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Look containers up through Docker's DNS on each request, not once at
    # startup: a deploy recreates `api` with a new IP, and nginx must start even
    # if prometheus or grafana are down. Using a variable in proxy_pass is what
    # makes nginx resolve it at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Requests come through Cloudflare, so take the visitor's address from the
    # header Cloudflare sets, but only when the request comes from Cloudflare
    # (https://www.cloudflare.com/ips/).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Test uploads can be large
    client_max_body_size 50M;

    location / {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prometheus/ {
        set $prometheus http://prometheus:9090;
        proxy_pass $prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        alias /var/www/judge/static/;
        access_log off;
    }

    location /media/ {
        alias /var/www/judge/media/;
        access_log off;
    }
}
