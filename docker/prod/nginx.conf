# nginx running in Docker (the `nginx` service in docker-compose.yml). It
# serves /static/ and /media/ straight from the varwww volume and proxies the
# rest to the other containers. For now it only listens on 127.0.0.1:8081 and
# the host nginx (matcomgrader.nginx.conf) forwards everything to it.

server {
    listen 80;

    # Look containers up through Docker's DNS on each request, not once at
    # startup: a deploy recreates `api` with a new IP, and nginx must start even
    # if prometheus or grafana are down. Using a variable in proxy_pass is what
    # makes nginx resolve it at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The host nginx is the one talking to the client, so take the client's
    # address from the X-Real-IP it sets instead of the Docker gateway's.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    # Test uploads can be large
    client_max_body_size 50M;

    location / {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /prometheus/ {
        set $prometheus http://prometheus:9090;
        proxy_pass $prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        alias /var/www/judge/static/;
        access_log off;
    }

    location /media/ {
        alias /var/www/judge/media/;
        access_log off;
    }
}
