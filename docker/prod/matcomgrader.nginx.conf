# Host nginx. It forwards everything to the nginx container (docker/prod/
# nginx.conf, published on 127.0.0.1:8081), which serves static and media files
# from the Docker volume and proxies the rest, so the host never reads Docker's
# directories and needs no permission changes there.
server {
    listen 80;
    server_name matcomgrader.com www.matcomgrader.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Test uploads can be large (the nginx container allows the same)
    client_max_body_size 50M;
}
