{% load i18n %}

<div class="form-group">

        <div class="alert alert-danger" role="alert">
            {{ field.errors }}
        </div>
    {% endif %}
    <div class="turnstile-wrapper">
        {# The widget outputs the cf-turnstile <div> and loads Cloudflare's script. #}
        {{ field }}
    </div>
</div>
